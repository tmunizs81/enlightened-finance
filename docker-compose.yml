# T2-SimplyFin Docker Compose

services:
  financeai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: financeai-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - financeai-network

  # Uptime Kuma - status/uptime monitoring with Telegram alerts
  # UI: http://SERVER_IP:${KUMA_PORT:-3001}
  # First access: create admin user, then add monitors + Telegram notification
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${KUMA_PORT:-3001}:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - financeai-network
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

networks:
  financeai-network:
    driver: bridge

volumes:
  uptime-kuma-data:
    driver: local
