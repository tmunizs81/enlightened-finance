<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SimplyFin — Controle e planejamento financeiro com IA</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="canonical" href="/" />
    <meta
      name="description"
      content="SimplyFin: organize gastos, planeje metas e cuide da saúde financeira pessoal e familiar com inteligência artificial. Pix, boleto ou cartão. Teste grátis por 7 dias."
    />
    <meta name="keywords" content="controle financeiro, planejamento financeiro, finanças pessoais, finanças familiares, orçamento, IA financeira, SimplyFin" />
    <meta name="author" content="T2 Soluções Tecnológicas" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="robots" content="index, follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SimplyFin" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:site_name" content="SimplyFin" />
    <meta property="og:title" content="SimplyFin — Controle e planejamento financeiro com IA" />
    <meta
      property="og:description"
      content="Organize gastos, planeje metas e cuide da saúde financeira da sua família com IA. Teste grátis por 7 dias."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/pwa-icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SimplyFin — Controle e planejamento financeiro com IA" />
    <meta name="twitter:description" content="Finanças pessoais e familiares organizadas com IA. Teste grátis por 7 dias." />
    <meta name="twitter:image" content="/pwa-icon-512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SimplyFin",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Sistema de controle e planejamento financeiro pessoal e familiar com inteligência artificial.",
        "offers": [
          { "@type": "Offer", "name": "Individual", "price": "24.90", "priceCurrency": "BRL" },
          { "@type": "Offer", "name": "Família", "price": "49.90", "priceCurrency": "BRL" }
        ],
        "publisher": { "@type": "Organization", "name": "T2 Soluções Tecnológicas" }
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #0d1117;
          gap: 20px;
        "
      >
        <img
          src="/pwa-icon-192.png"
          alt="T2-SimplyFin"
          width="80"
          height="80"
          style="border-radius: 18px"
        />
        <p
          style="
            color: #00d4aa;
            font-family: system-ui;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
          "
        >
          T2-SimplyFin
        </p>
        <div
          style="
            width: 32px;
            height: 32px;
            border: 3px solid #1e293b;
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: sp 0.8s linear infinite;
          "
        ></div>
        <style>
          @keyframes sp {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
